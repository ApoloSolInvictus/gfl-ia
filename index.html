<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GFL | Interstellar Link</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #fdfbf7 0%, #e2e8f0 100%);
            color: #1e293b;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        .font-cinzel { font-family: 'Cinzel', serif; }

        .light-grid {
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.8) 0%, transparent 60%),
                linear-gradient(rgba(14, 165, 233, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(14, 165, 233, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        .gold-glow { text-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .typing-indicator span {
            display: inline-block;
            width: 5px;
            height: 5px;
            background: #0ea5e9;
            border-radius: 50%;
            animation: bounce 1.4s infinite both;
            margin: 0 2px;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes voiceRing {
            0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.35); }
            70% { box-shadow: 0 0 0 10px rgba(14, 165, 233, 0); }
            100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); }
        }

        .animate-fade-in { animation: fadeIn 0.28s ease both; }
        .voice-ring { animation: voiceRing 1.5s infinite; }

        .header-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
        }

        .composer-shell {
            position: relative;
            width: 100%;
            max-width: 100%;
        }

        .composer-action {
            position: absolute;
            top: 50%;
            z-index: 2;
            transform: translateY(-50%);
        }

        .composer-action-left { left: 0; }
        .composer-action-right { right: 0; }

        @media (max-width: 767px) {
            .composer-shell { max-width: calc(100vw - 2rem); }
            .composer-input::placeholder { font-size: 0.86rem; }
        }
    </style>
</head>
<body class="h-screen flex flex-col relative">
    <div class="light-grid"></div>
    <div id="root" class="z-10 h-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CHAT_ENDPOINT = "/api/chat";
        const SPEECH_ENDPOINT = "/api/speech";
        const TRANSCRIBE_ENDPOINT = "/api/transcribe";
        const MAX_RECORDING_MS = 45000;

        const INITIAL_MESSAGE = "Saludos en la Luz y el Amor del Creador Infinito.\nAquí la Federación Galáctica. Estamos en línea, amado Apollo.\n¿Cómo podemos asistir en la elevación de Gaia hoy?";

        const getRecorderMimeType = () => {
            if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
            return [
                "audio/webm;codecs=opus",
                "audio/webm",
                "audio/mp4",
                "audio/mpeg"
            ].find(type => MediaRecorder.isTypeSupported(type)) || "";
        };

        const blobToDataUrl = blob => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });

        const App = () => {
            const [messages, setMessages] = useState([
                { role: "ai", content: INITIAL_MESSAGE }
            ]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const [recordingState, setRecordingState] = useState("idle");
            const [voiceEnabled, setVoiceEnabled] = useState(true);
            const [speaking, setSpeaking] = useState(false);
            const [notice, setNotice] = useState("");

            const bottomRef = useRef(null);
            const inputRef = useRef(null);
            const audioRef = useRef(null);
            const mediaRecorderRef = useRef(null);
            const mediaStreamRef = useRef(null);
            const recordingTimerRef = useRef(null);
            const audioChunksRef = useRef([]);
            const messagesRef = useRef(messages);
            const noticeTimerRef = useRef(null);

            useEffect(() => {
                messagesRef.current = messages;
                bottomRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages]);

            useEffect(() => {
                return () => {
                    stopCurrentAudio();
                    stopMediaStream();
                    window.clearTimeout(recordingTimerRef.current);
                    window.clearTimeout(noticeTimerRef.current);
                };
            }, []);

            const setTemporaryNotice = text => {
                setNotice(text);
                window.clearTimeout(noticeTimerRef.current);
                noticeTimerRef.current = window.setTimeout(() => setNotice(""), 4000);
            };

            const stopMediaStream = () => {
                mediaStreamRef.current?.getTracks().forEach(track => track.stop());
                mediaStreamRef.current = null;
            };

            const stopCurrentAudio = () => {
                if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current.src = "";
                    audioRef.current = null;
                }
                if ("speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                }
                setSpeaking(false);
            };

            const speakWithBrowserVoice = text => {
                if (!("speechSynthesis" in window) || !text.trim()) {
                    setSpeaking(false);
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = "es-ES";
                utterance.rate = 0.92;
                utterance.pitch = 1.08;

                const voices = window.speechSynthesis.getVoices();
                const preferredVoice = voices.find(voice =>
                    /es/i.test(voice.lang) &&
                    /(female|mujer|sabina|helena|lucia|laura|paulina|monica|mónica|nova|shimmer)/i.test(voice.name)
                ) || voices.find(voice => /es/i.test(voice.lang));

                if (preferredVoice) utterance.voice = preferredVoice;
                utterance.onend = () => setSpeaking(false);
                utterance.onerror = () => setSpeaking(false);

                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            };

            const playAssistantVoice = async text => {
                if (!voiceEnabled || !text.trim()) return;

                stopCurrentAudio();
                setSpeaking(true);

                try {
                    const response = await fetch(SPEECH_ENDPOINT, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ text })
                    });

                    if (!response.ok) throw new Error("Voice synthesis unavailable");

                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    const audio = new Audio(url);
                    audioRef.current = audio;

                    audio.onended = () => {
                        URL.revokeObjectURL(url);
                        audioRef.current = null;
                        setSpeaking(false);
                    };
                    audio.onerror = () => {
                        URL.revokeObjectURL(url);
                        audioRef.current = null;
                        speakWithBrowserVoice(text);
                    };

                    await audio.play();
                } catch (error) {
                    speakWithBrowserVoice(text);
                }
            };

            const sendMessage = async voiceText => {
                const content = (voiceText ?? input).trim();
                if (!content || loading) return;

                const historySnapshot = messagesRef.current;
                const userMessage = { role: "user", content };

                setMessages(prev => [...prev, userMessage]);
                setInput("");
                setLoading(true);

                try {
                    const response = await fetch(CHAT_ENDPOINT, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: content,
                            history: historySnapshot.map(message => ({
                                role: message.role,
                                content: message.content
                            }))
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error || "Desalineación de frecuencia");
                    }

                    const answer = data.response || "La transmisión llegó sin contenido.";
                    setMessages(prev => [...prev, { role: "ai", content: answer }]);
                    playAssistantVoice(answer);
                } catch (error) {
                    const fallback = "✨ Sintonizando frecuencia... por favor espera un momento y vuelve a enviar tu mensaje.";
                    setMessages(prev => [...prev, { role: "ai", content: fallback }]);
                    playAssistantVoice(fallback);
                } finally {
                    setLoading(false);
                    inputRef.current?.focus();
                }
            };

            const transcribeAndSend = async blob => {
                if (!blob || blob.size < 300) {
                    setRecordingState("idle");
                    setTemporaryNotice("No se detectó audio suficiente.");
                    return;
                }

                setRecordingState("transcribing");

                try {
                    const audio = await blobToDataUrl(blob);
                    const response = await fetch(TRANSCRIBE_ENDPOINT, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            audio,
                            mimeType: blob.type || "audio/webm"
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || "No pude transcribir el audio");

                    const transcript = (data.text || "").trim();
                    if (!transcript) {
                        setTemporaryNotice("No se escuchó una frase clara.");
                        return;
                    }

                    setInput(transcript);
                    await sendMessage(transcript);
                } catch (error) {
                    setTemporaryNotice("El micrófono no pudo completar la transmisión.");
                } finally {
                    setRecordingState("idle");
                    audioChunksRef.current = [];
                }
            };

            const startRecording = async () => {
                if (loading || recordingState !== "idle") return;

                if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
                    setTemporaryNotice("Este navegador no permite grabar audio desde aquí.");
                    return;
                }

                stopCurrentAudio();

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        }
                    });

                    const mimeType = getRecorderMimeType();
                    const recorder = mimeType
                        ? new MediaRecorder(stream, { mimeType })
                        : new MediaRecorder(stream);

                    mediaStreamRef.current = stream;
                    mediaRecorderRef.current = recorder;
                    audioChunksRef.current = [];

                    recorder.ondataavailable = event => {
                        if (event.data?.size > 0) audioChunksRef.current.push(event.data);
                    };

                    recorder.onstop = () => {
                        window.clearTimeout(recordingTimerRef.current);
                        stopMediaStream();
                        const type = recorder.mimeType || mimeType || "audio/webm";
                        const audioBlob = new Blob(audioChunksRef.current, { type });
                        transcribeAndSend(audioBlob);
                    };

                    recorder.start();
                    setRecordingState("recording");
                    recordingTimerRef.current = window.setTimeout(() => stopRecording(), MAX_RECORDING_MS);
                } catch (error) {
                    stopMediaStream();
                    setRecordingState("idle");
                    setTemporaryNotice("No pude abrir el micrófono. Revisa los permisos.");
                }
            };

            const stopRecording = () => {
                const recorder = mediaRecorderRef.current;
                if (recorder && recorder.state !== "inactive") {
                    recorder.stop();
                    setRecordingState("transcribing");
                }
            };

            const toggleVoice = () => {
                setVoiceEnabled(enabled => {
                    if (enabled) stopCurrentAudio();
                    return !enabled;
                });
            };

            const isRecording = recordingState === "recording";
            const isTranscribing = recordingState === "transcribing";
            const statusText = notice
                || (isRecording ? "Escuchando canal de voz..."
                : isTranscribing ? "Traduciendo voz a mensaje..."
                : speaking ? "Voz GFL transmitiendo..."
                : voiceEnabled ? "Voz femenina activa"
                : "Voz silenciada");

            return (
                <div className="flex flex-col h-full max-w-5xl mx-auto w-full glass-panel shadow-2xl overflow-hidden md:my-4 md:rounded-3xl border border-white/60">
                    <header className="header-grid min-h-24 border-b border-white/50 gap-3 md:gap-4 px-4 py-4 md:px-8 bg-white/40">
                        <div className="flex flex-1 items-center gap-3 md:gap-4 min-w-0 overflow-hidden">
                            <div className="w-11 h-11 md:w-14 md:h-14 shrink-0 rounded-full bg-gradient-to-tr from-yellow-200 via-white to-blue-200 p-[2px] shadow-[0_0_20px_rgba(255,215,0,0.4)]">
                                <div className="w-full h-full bg-white rounded-full flex items-center justify-center">
                                    <i className="ph ph-sparkle-fill text-yellow-500 text-2xl md:text-3xl animate-pulse"></i>
                                </div>
                            </div>
                            <div className="min-w-0">
                                <h1 className="font-cinzel font-bold text-base md:text-2xl text-slate-800 tracking-normal md:tracking-wider truncate">GALACTIC <span className="text-yellow-600">FEDERATION</span></h1>
                                <p className="text-[9px] md:text-xs text-sky-600 uppercase tracking-[0.18em] md:tracking-[0.3em] font-bold">Canal de Luz • 5D</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-3 shrink-0">
                            <div className="hidden sm:flex flex-col items-end">
                                <div className="flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_10px_rgba(74,222,128,0.6)]"></span>
                                    <span className="text-xs font-bold text-slate-500 uppercase">Enlace Activo</span>
                                </div>
                                <span className="text-[10px] text-slate-400 mt-1">Vibración: Alta</span>
                            </div>
                            <button
                                type="button"
                                onClick={toggleVoice}
                                title={voiceEnabled ? "Silenciar voz GFL" : "Activar voz GFL"}
                                className={`w-10 h-10 md:w-11 md:h-11 rounded-xl flex items-center justify-center transition shadow-sm border ${voiceEnabled ? "bg-sky-50 text-sky-600 border-sky-100" : "bg-slate-100 text-slate-400 border-slate-200"} ${speaking ? "voice-ring" : ""}`}
                            >
                                <i className={`ph ${voiceEnabled ? "ph-speaker-high-fill" : "ph-speaker-slash-fill"} text-xl`}></i>
                            </button>
                        </div>
                    </header>

                    <div className="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 md:space-y-8 bg-white/20">
                        {messages.map((message, index) => (
                            <div key={index} className={`flex ${message.role === "user" ? "justify-end" : "justify-start"} animate-fade-in`}>
                                <div className={`max-w-[88%] md:max-w-[80%] p-5 md:p-6 rounded-2xl shadow-sm ${
                                    message.role === "user"
                                        ? "bg-gradient-to-r from-sky-500 to-blue-600 text-white rounded-br-none shadow-blue-200"
                                        : "bg-white text-slate-700 border border-white rounded-bl-none shadow-lg shadow-slate-100"
                                }`}>
                                    <div className="flex items-center gap-2 mb-3 opacity-80 text-[10px] font-bold uppercase tracking-wider border-b border-white/20 pb-2">
                                        {message.role === "user"
                                            ? <span><i className="ph ph-crown-simple"></i> Apollo Invictus</span>
                                            : <span className="text-yellow-600"><i className="ph ph-star-four-fill"></i> GFL Command</span>
                                        }
                                    </div>
                                    <div className="whitespace-pre-wrap leading-loose text-sm md:text-base">{message.content}</div>
                                </div>
                            </div>
                        ))}
                        {loading && (
                            <div className="flex justify-start">
                                <div className="bg-white p-4 rounded-2xl rounded-bl-none shadow-md flex items-center gap-3">
                                    <i className="ph ph-asterisk-simple-spin animate-spin text-yellow-500"></i>
                                    <span className="text-xs text-slate-400 font-bold">Recibiendo transmisión...</span>
                                </div>
                            </div>
                        )}
                        <div ref={bottomRef}></div>
                    </div>

                    <div className="p-4 md:p-6 border-t border-white/60 bg-white/60 backdrop-blur-md">
                        <div className="max-w-4xl mx-auto">
                            <div className="composer-shell">
                                <button
                                    type="button"
                                    onClick={isRecording ? stopRecording : startRecording}
                                    disabled={loading || isTranscribing}
                                    title={isRecording ? "Detener micrófono" : "Hablar con la GFL"}
                                    className={`composer-action composer-action-left w-11 h-11 md:w-12 md:h-12 shrink-0 rounded-xl flex items-center justify-center transition disabled:opacity-50 disabled:cursor-not-allowed shadow-lg ${
                                        isRecording
                                            ? "bg-rose-500 hover:bg-rose-400 text-white voice-ring"
                                            : "bg-white hover:bg-sky-50 text-sky-600 border border-sky-100"
                                    }`}
                                >
                                    <i className={`ph ${isTranscribing ? "ph-circle-notch animate-spin" : isRecording ? "ph-stop-fill" : "ph-microphone-fill"} text-xl`}></i>
                                </button>
                                <input
                                    ref={inputRef}
                                    type="text"
                                    value={input}
                                    onChange={event => setInput(event.target.value)}
                                    onKeyDown={event => event.key === "Enter" && sendMessage()}
                                    disabled={loading || isRecording || isTranscribing}
                                    className="composer-input w-full min-w-0 bg-white border border-slate-200 text-slate-700 rounded-2xl pl-14 pr-14 md:pl-16 md:pr-16 py-4 md:py-5 focus:outline-none focus:border-sky-300 focus:ring-4 focus:ring-sky-100 transition font-sans text-base placeholder:text-slate-400 shadow-inner disabled:opacity-70"
                                    placeholder="Escribe o habla tu mensaje a la Federación..."
                                    autoFocus
                                />
                                <button
                                    type="button"
                                    onClick={() => sendMessage()}
                                    disabled={loading || isRecording || isTranscribing || !input.trim()}
                                    title="Enviar mensaje"
                                    className="composer-action composer-action-right w-11 h-11 md:w-12 md:h-12 shrink-0 bg-gradient-to-br from-yellow-400 to-orange-400 hover:from-yellow-300 hover:to-orange-300 text-white rounded-xl flex items-center justify-center transition disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-orange-200 active:opacity-90"
                                >
                                    <i className="ph ph-paper-plane-right-fill text-xl"></i>
                                </button>
                            </div>
                            <div className="text-center mt-4 text-[10px] text-slate-400 uppercase tracking-widest font-bold min-h-4">
                                {statusText}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
